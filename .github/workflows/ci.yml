name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-baselines:
        description: Regenerate every visual baseline (download them from the visual-report artifact)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: PHPCS, PHPStan, JSON schemas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Composer install (retried; codeload.github.com answers 429 at times)
        run: for i in 1 2 3; do composer install --no-interaction --no-progress && exit 0; sleep 20; done; exit 1
      - run: composer check
      - name: theme.json in sync with design tokens
        run: php tools/tokens.php --check
      - name: Block rules and manifest
        run: php tools/blocks.php --check
      - name: Pattern rules
        run: php tools/patterns.php --check
      - name: One version everywhere, changelog entries, screenshot
        run: php tools/release.php check
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:json

  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l
        run: find theme engine tools -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  compat:
    # Every PHP version, database and WordPress release Pergel supports, each
    # at least once, instead of all their combinations: the oldest of
    # everything together, then each newer one. The budget, shop and
    # rehearsal jobs stay on the live setup (PHP 8.4, MariaDB 11.8).
    # WordPress nightly is the next release; it may fail without failing CI.
    name: Compat (PHP ${{ matrix.php }}, WP ${{ matrix.wp }}, ${{ matrix.db }}${{ matrix.woocommerce && ', WooCommerce' || '' }})
    runs-on: ubuntu-24.04
    needs: [lint, syntax]
    timeout-minutes: 25
    continue-on-error: ${{ matrix.wp == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', wp: '7.1', db: 'mariadb:10.6', woocommerce: '11.2.1' }
          - { php: '8.2', wp: latest, db: 'mysql:8.0', woocommerce: '' }
          - { php: '8.3', wp: latest, db: 'mysql:8.4', woocommerce: latest }
          - { php: '8.4', wp: latest, db: 'mariadb:10.6', woocommerce: '' }
          - { php: '8.5', wp: latest, db: 'mariadb:11.8', woocommerce: latest }
          - { php: '8.4', wp: nightly, db: 'mariadb:11.8', woocommerce: latest }
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ startsWith(matrix.db, 'mysql') && 'mysqladmin ping -h 127.0.0.1 -uroot -proot' || 'healthcheck.sh --connect --innodb_initialized' }}"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      WP_DIR: /tmp/pergel-wp
      SITE_URL: http://127.0.0.1:8080
      WP_VERSION: ${{ matrix.wp }}
      WOOCOMMERCE: ${{ matrix.woocommerce }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, gd, intl, zip, zlib
          # Without the JIT, as in the shop job; the budget job keeps it.
          ini-values: opcache.enable_cli=1, opcache.jit=disable
          tools: composer:v2, wp-cli
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Composer install (retried; codeload.github.com answers 429 at times)
        run: for i in 1 2 3; do composer install --no-interaction --no-progress && exit 0; sleep 20; done; exit 1
      - name: Install WordPress + Pergel
        id: setup
        run: bash tools/ci/setup-wp.sh
      - name: Integration tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: PERGEL_WP_DIR="$WP_DIR" php vendor/bin/phpunit -c phpunit-integration.xml.dist --display-deprecations --fail-on-deprecation
      - name: WP-CLI commands
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tools/ci/cli-smoke.sh
      - name: Start PHP server
        id: server
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bash tools/ci/serve.sh > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null "$SITE_URL/" && exit 0; sleep 1; done
          cat /tmp/php-server.log; exit 1
      - name: Smoke
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          paths=(/ /blog/ /pergel-sample-post/ /pergel-sample-page/ /category/pergel-test/ '/?s=pergel' /feed/ /wp-login.php /wp-json/ /wp-sitemap.xml)
          if [ -n "$WOOCOMMERCE" ]; then paths+=(/shop/ /cart/ /my-account/ /wp-json/wc/store/v1/products); fi
          bash tools/ci/smoke.sh "${paths[@]}" --missing /pergel-budget-missing/
      - name: PHP notices
        if: always()
        run: bash tools/ci/notices.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compat-logs-php${{ matrix.php }}-wp${{ matrix.wp }}-${{ strategy.job-index }}
          path: |
            /tmp/php-server.log
            /tmp/pergel-requests.log
            /tmp/pergel-wp/wp-content/debug.log
          if-no-files-found: ignore

  budget:
    name: Smoke + performance budget (WP latest, PHP 8.4, MariaDB 11.8)
    runs-on: ubuntu-24.04
    needs: [lint, syntax]
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /tmp/pergel-wp
      SITE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli, gd, intl, zip, zlib
          ini-values: opcache.enable_cli=1
          tools: composer:v2, wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Composer install (retried; codeload.github.com answers 429 at times)
        run: for i in 1 2 3; do composer install --no-interaction --no-progress && exit 0; sleep 20; done; exit 1
      - name: Install WordPress + Pergel
        run: bash tools/ci/setup-wp.sh
      - name: Integration tests (WordPress)
        # PHPUnit itself crashes or hangs under PHP 8.4's JIT, which setup-php turns
        # on with opcache.enable_cli (a bare PHPUnit test does it too). WP-CLI, the
        # server and the budget below keep the JIT; the block editor step does not.
        run: PERGEL_WP_DIR="$WP_DIR" php -d opcache.jit=disable vendor/bin/phpunit -c phpunit-integration.xml.dist
      - name: WP-CLI commands
        run: bash tools/ci/cli-smoke.sh
      - name: Start PHP server
        run: |
          bash tools/ci/serve.sh > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null "$SITE_URL/" && exit 0; sleep 1; done
          cat /tmp/php-server.log; exit 1
      - name: Smoke
        run: bash tools/ci/smoke.sh / /blog/ /pergel-sample-post/ /pergel-sample-page/ /category/pergel-test/ '/?s=pergel' /feed/ /wp-login.php /wp-json/ /wp-sitemap.xml --missing /pergel-budget-missing/
      - name: Translation templates up to date
        run: |
          wp i18n make-pot theme /tmp/pergel.pot --slug=pergel --domain=pergel --exclude=tokens --no-location
          wp i18n make-pot engine /tmp/pergel-engine.pot --slug=pergel-engine --domain=pergel-engine --exclude=build --no-location
          diff -I '^"POT-Creation-Date' theme/languages/pergel.pot /tmp/pergel.pot
          diff -I '^"POT-Creation-Date' engine/languages/pergel-engine.pot /tmp/pergel-engine.pot
      - name: Bundled translations complete and compiled
        run: php tools/i18n.php --check
      - name: Performance budget
        run: npm run budget -- --base "$SITE_URL" --log "$WP_DIR/wp-content/pergel-perf.jsonl" --label ci
      - name: Patterns in the block editor
        # The JIT crashes php -S on wp-admin/post-new.php (the database logs an
        # aborted connection and the request never ends), so the server is
        # restarted without it once the budget is measured.
        run: |
          pkill -f tools/ci/serve.sh || true
          pkill -f 'php.* -S 127.0.0.1:8080' || true
          bash tools/ci/serve.sh -d opcache.jit=disable >> /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null "$SITE_URL/" && break; sleep 1; done
          export PERGEL_QA_PASSWORD="$(head -c 18 /dev/urandom | base64)"
          wp --path="$WP_DIR" user create pergel-qa qa@example.invalid --role=administrator --user_pass="$PERGEL_QA_PASSWORD" --porcelain > /dev/null
          node tools/patterns/editor-check.mjs --base "$SITE_URL"
      - name: PHP notices
        if: always()
        run: bash tools/ci/notices.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-report
          path: |
            reports/
            /tmp/php-server.log
            /tmp/pergel-requests.log
          if-no-files-found: ignore

  review:
    name: Plugin Check + Theme Check (zip contents)
    runs-on: ubuntu-24.04
    needs: [lint, syntax]
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /tmp/pergel-wp
      SEED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli, gd, intl, zip, zlib
          tools: wp-cli
      - name: Install WordPress + Pergel
        run: bash tools/ci/setup-wp.sh
      - name: Plugin Check and Theme Check
        run: bash tools/ci/review.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: /tmp/pergel-dist/*.zip
          if-no-files-found: error
      - name: PHP notices
        if: always()
        run: bash tools/ci/notices.sh

  shop:
    name: Shop (WooCommerce ${{ matrix.woocommerce }}) smoke, budget, checkout
    runs-on: ubuntu-24.04
    needs: [lint, syntax]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The newest release and the oldest one Pergel supports.
        woocommerce: [latest, '11.2.1']
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /tmp/pergel-wp
      SITE_URL: http://127.0.0.1:8080
      WOOCOMMERCE: ${{ matrix.woocommerce }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli, gd, intl, zip, zlib
          # No JIT anywhere in this job: on PHP 8.4 it crashes php -S and
          # WP-CLI on WooCommerce requests (docs/DECISIONS.md).
          ini-values: opcache.enable_cli=1, opcache.jit=disable
          tools: composer:v2, wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      - name: Composer install (retried; codeload.github.com answers 429 at times)
        run: for i in 1 2 3; do composer install --no-interaction --no-progress && exit 0; sleep 20; done; exit 1
      - name: Install WordPress + WooCommerce + Pergel
        id: setup
        run: bash tools/ci/setup-wp.sh
      - name: Integration tests (WordPress + WooCommerce)
        run: PERGEL_WP_DIR="$WP_DIR" php vendor/bin/phpunit -c phpunit-integration.xml.dist
      # The steps below run on when one before them fails (after setup and
      # the server), so one CI run reports every failing check.
      - name: Shop starter
        id: starter
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: wp --path="$WP_DIR" pergel starter install shop
      - name: Start PHP server
        id: server
        if: ${{ !cancelled() && steps.starter.outcome == 'success' }}
        run: |
          bash tools/ci/serve.sh > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null "$SITE_URL/" && exit 0; sleep 1; done
          cat /tmp/php-server.log; exit 1
      - name: Smoke
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: >-
          bash tools/ci/smoke.sh / /shop/ /product-category/apparel/ /product/canvas-tote-bag/
          /product/basic-t-shirt/ /product/coffee-break-set/ '/?s=mug&post_type=product' /cart/
          /my-account/ /journal/ /wp-json/wc/store/v1/products /wp-sitemap.xml
          --missing /product/pergel-budget-missing/
      - name: Performance budget (shop)
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        # Measured without WP_DEBUG: WooCommerce skips its own caches under it
        # and writes on every view (docs/DECISIONS.md).
        run: |
          wp --path="$WP_DIR" config set WP_DEBUG false --raw
          status=0
          npm run budget -- --budget tests/budget/shop.json --base "$SITE_URL" --log "$WP_DIR/wp-content/pergel-perf.jsonl" --label "ci-shop-$WOOCOMMERCE" || status=$?
          wp --path="$WP_DIR" config set WP_DEBUG true --raw
          exit $status
      - name: Checkout and sales modes end to end
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        env:
          PERGEL_BASE: ${{ env.SITE_URL }}
        run: npm run test:shop
      - name: Shop patterns (axe and overflow)
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        env:
          PERGEL_BASE: ${{ env.SITE_URL }}
          PERGEL_SHOP: '1'
        run: npx playwright test --grep-invert @visual --grep 'pergel-shop sections|shop-[a-z-]+ page$'
      - name: Shop patterns in the block editor
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          export PERGEL_QA_PASSWORD="$(head -c 18 /dev/urandom | base64)"
          wp --path="$WP_DIR" user create pergel-qa qa@example.invalid --role=administrator --user_pass="$PERGEL_QA_PASSWORD" --porcelain > /dev/null
          node tools/patterns/editor-check.mjs --base "$SITE_URL"
      - name: PHP notices
        if: always()
        run: bash tools/ci/notices.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-report-${{ matrix.woocommerce }}
          path: |
            reports/
            playwright-report/
            test-results/
            /tmp/php-server.log
            /tmp/pergel-requests.log
          if-no-files-found: ignore

  scale:
    name: Scale (5,000 products, 2,000 posts) smoke and budget
    runs-on: ubuntu-24.04
    needs: [lint, syntax]
    timeout-minutes: 40
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /tmp/pergel-wp
      SITE_URL: http://127.0.0.1:8080
      WOOCOMMERCE: latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli, gd, intl, zip, zlib
          # No JIT, as in the shop job (docs/DECISIONS.md).
          ini-values: opcache.enable_cli=1, opcache.jit=disable
          tools: wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install WordPress + WooCommerce + Pergel
        run: bash tools/ci/setup-wp.sh
      - name: Shop starter
        run: wp --path="$WP_DIR" pergel starter install shop
      - name: Scale content
        # Same numbers every run (tools/fixtures/scale.php); the search index
        # is rebuilt so it holds everything, as after an import.
        run: |
          wp --path="$WP_DIR" eval-file tools/fixtures/scale.php products=5000 posts=2000
          wp --path="$WP_DIR" pergel search reindex
      - name: Start PHP server
        run: |
          bash tools/ci/serve.sh > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null "$SITE_URL/" && exit 0; sleep 1; done
          cat /tmp/php-server.log; exit 1
      - name: Smoke
        run: >-
          bash tools/ci/smoke.sh /shop/ /shop/page/300/ /product-category/pergel-scale-cat-7/
          /product/pergel-scale-2500/ '/?s=copper+lamp&post_type=product' /journal/page/150/
          /pergel-scale-post-1500/ '/?s=scale+post+1500' '/wp-json/pergel/v1/search?q=copper&type=product'
          '/wp-json/wc/store/v1/products?search=copper' /wp-sitemap.xml /wp-sitemap-posts-product-2.xml
      - name: Performance budget (scale)
        # Without WP_DEBUG, as in the shop job (docs/DECISIONS.md).
        run: |
          wp --path="$WP_DIR" config set WP_DEBUG false --raw
          status=0
          npm run budget -- --budget tests/budget/scale.json --base "$SITE_URL" --log "$WP_DIR/wp-content/pergel-perf.jsonl" --label ci-scale || status=$?
          wp --path="$WP_DIR" config set WP_DEBUG true --raw
          exit $status
      - name: PHP notices
        if: always()
        run: bash tools/ci/notices.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-report
          path: |
            reports/
            /tmp/php-server.log
            /tmp/pergel-requests.log
          if-no-files-found: ignore

  visual:
    name: Pattern accessibility + visual regression
    runs-on: ubuntu-24.04
    needs: [lint, syntax]
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /tmp/pergel-wp
      SITE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli, gd, intl, zip, zlib
          tools: wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install WordPress + Pergel
        run: bash tools/ci/setup-wp.sh
      - name: Start PHP server
        run: |
          bash tools/ci/serve.sh > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null "$SITE_URL/" && exit 0; sleep 1; done
          cat /tmp/php-server.log; exit 1
      - name: axe, overflow and screenshots
        # Baselines are made here on Linux only. A missing one is written to the
        # visual-report artifact, to be downloaded and committed.
        env:
          PERGEL_BASE: ${{ env.SITE_URL }}
          UPDATE: ${{ inputs.update-baselines && 'all' || 'missing' }}
        run: npx playwright test --update-snapshots="$UPDATE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-report
          path: |
            tests/visual/baselines/
            test-results/
            playwright-report/
            /tmp/php-server.log
            /tmp/pergel-requests.log
          if-no-files-found: ignore

  seo-matrix:
    name: SEO matrix (Pergel alone + 5 free SEO plugins)
    runs-on: ubuntu-24.04
    needs: [lint, syntax]
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /tmp/pergel-wp
      SITE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli, gd, intl, zip, zlib
          tools: wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install WordPress + Pergel
        run: bash tools/ci/setup-wp.sh
      - name: Start PHP server
        run: |
          bash tools/ci/serve.sh > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null "$SITE_URL/" && exit 0; sleep 1; done
          cat /tmp/php-server.log; exit 1
      - name: SEO matrix (latest plugin versions from wordpress.org)
        run: INSTALL=1 bash tools/seo/matrix.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: seo-matrix-logs
          path: |
            /tmp/php-server.log
            /tmp/pergel-requests.log
            /tmp/pergel-wp/wp-content/debug.log
          if-no-files-found: ignore

  rehearsal:
    name: Rehearsal site from the project package
    runs-on: ubuntu-24.04
    needs: [lint, syntax]
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_DIR: /tmp/pergel-wp
      SITE_URL: http://127.0.0.1:8080
      # The package brings the content; the seed of the other jobs would be
      # pages the import did not make.
      SEED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli, gd, intl, zip, zlib
          ini-values: opcache.enable_cli=1
          tools: wp-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install WordPress + Pergel
        run: bash tools/ci/setup-wp.sh
      - name: Site language of the package (retried; downloads.wordpress.org times out at times)
        run: for i in 1 2 3; do wp --path="$WP_DIR" language core install tr_TR && exit 0; sleep 15; done; exit 1
      - name: Build from the package twice and export it back
        run: bash tools/ci/rehearsal.sh examples/ornek-mimarlik
      - name: Start PHP server
        run: |
          bash tools/ci/serve.sh > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null "$SITE_URL/" && exit 0; sleep 1; done
          cat /tmp/php-server.log; exit 1
      - name: Smoke
        run: bash tools/ci/smoke.sh / /hakkimizda/ /hizmetler/ /projeler/ /iletisim/ /blog/ /wp-sitemap.xml --missing /pergel-budget-missing/
      - name: Performance budget (rehearsal)
        run: npm run budget -- --budget tests/budget/rehearsal.json --base "$SITE_URL" --log "$WP_DIR/wp-content/pergel-perf.jsonl" --label ci-rehearsal
      - name: PHP notices
        if: always()
        run: bash tools/ci/notices.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-report
          path: |
            reports/
            /tmp/php-server.log
            /tmp/pergel-requests.log
          if-no-files-found: ignore
