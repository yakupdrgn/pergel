name: Release

# A version tag (v1.0.0) on main makes a draft GitHub release with the theme
# and engine zips. The draft is published by hand after a last look; nothing
# goes to WordPress.org.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    name: Draft release with the zips
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: zip
      - name: Tag names the version in every file
        run: php tools/release.php check --tag="$GITHUB_REF_NAME"
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Zips
        run: php tools/release.php package dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          php tools/release.php notes > dist/notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --verify-tag \
            --title "Pergel $GITHUB_REF_NAME" --notes-file dist/notes.md
